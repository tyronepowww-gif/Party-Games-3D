<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
  >
  <meta name="theme-color" content="#101328">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Thumb Arena">
  <title>Thumb Arena Console • T-Engine</title>

  <style>
    :root {
      --bg: #101328;
      --panel: rgba(37, 42, 80, .96);
      --panel2: rgba(18, 21, 45, .96);
      --line: rgba(255,255,255,.16);
      --text: #f8f9ff;
      --muted: #bbc3e5;
      --cyan: #57e5ff;
      --pink: #ff6e97;
      --green: #90ff6b;
      --gold: #ffd35f;
      --purple: #ad7dff;
      --red: #ff5372;
      --safe-top: max(12px, env(safe-area-inset-top));
      --safe-bottom: max(12px, env(safe-area-inset-bottom));
      --shadow: 0 14px 34px rgba(0,0,0,.34);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #060713;
      color: var(--text);
      font-family:
        ui-rounded,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 620px;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 12% 10%,
          rgba(87,229,255,.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 18%,
          rgba(173,125,255,.15),
          transparent 28%
        ),
        linear-gradient(
          155deg,
          #101328,
          #25194d
        );
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: none;
      overflow: hidden;
      padding: var(--safe-top) 10px var(--safe-bottom);
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    .console-header {
      display: flex;
      min-height: 70px;
      padding: 0 5px 10px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      min-width: 0;
    }

    .brand small {
      display: block;
      color: var(--cyan);
      font-size: .61rem;
      font-weight: 1000;
      letter-spacing: .13em;
    }

    .brand strong {
      display: block;
      font-size: 1.28rem;
      font-weight: 1000;
      letter-spacing: -.05em;
    }

    .profile-chip {
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 900;
      text-align: right;
      background: var(--panel);
    }

    .profile-chip b {
      display: block;
      color: var(--gold);
      font-size: .85rem;
    }

    .console-body {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 3px 2px 20px;
      scrollbar-width: none;
    }

    .console-body::-webkit-scrollbar {
      display: none;
    }

    .section-label {
      margin: 4px 5px 9px;
      color: var(--muted);
      font-size: .65rem;
      font-weight: 1000;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .cartridge-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }

    .cartridge {
      min-height: 166px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 23px;
      color: var(--text);
      text-align: left;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.11),
          rgba(255,255,255,.035)
        );
      box-shadow: var(--shadow);
      transition:
        transform .16s ease,
        border-color .16s ease;
    }

    .cartridge:active {
      transform: scale(.97);
    }

    .cartridge-icon {
      display: grid;
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      place-items: center;
      border-radius: 16px;
      font-size: 1.65rem;
      background: rgba(255,255,255,.1);
    }

    .cartridge-title {
      display: block;
      margin-bottom: 5px;
      font-size: .94rem;
      font-weight: 1000;
    }

    .cartridge-description {
      display: block;
      min-height: 39px;
      color: var(--muted);
      font-size: .67rem;
      line-height: 1.35;
    }

    .cartridge-record {
      display: block;
      margin-top: 9px;
      color: var(--gold);
      font-size: .65rem;
      font-weight: 950;
    }

    .console-panel {
      margin-top: 12px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 21px;
      background: var(--panel2);
    }

    .console-panel-title {
      margin-bottom: 10px;
      font-size: .76rem;
      font-weight: 1000;
    }

    .console-stats {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 7px;
    }

    .stat {
      padding: 10px 6px;
      border-radius: 14px;
      text-align: center;
      background: rgba(255,255,255,.07);
    }

    .stat b {
      display: block;
      font-size: 1rem;
    }

    .stat span {
      color: var(--muted);
      font-size: .57rem;
      font-weight: 900;
    }

    .console-actions {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      width: 100%;
      min-height: 52px;
      padding: 12px 15px;
      border-radius: 17px;
      color: #13152a;
      font-weight: 1000;
      letter-spacing: .04em;
      background: var(--cyan);
      box-shadow:
        0 5px 0 rgba(0,0,0,.22),
        0 12px 21px rgba(0,0,0,.18);
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0,0,0,.22);
    }

    .btn.dark {
      color: var(--text);
      background: #3a3e69;
    }

    .btn.secondary {
      color: #242644;
      background: #f0f2ff;
    }

    /* =========================================================
       GAME SCREEN
       ========================================================= */

    .game-screen {
      padding: var(--safe-top) 10px var(--safe-bottom);
    }

    .hud {
      display: flex;
      min-height: 62px;
      padding: 0 5px 8px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hud-left {
      min-width: 0;
    }

    .hud-label {
      display: block;
      color: var(--muted);
      font-size: .64rem;
      font-weight: 950;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .hud-value {
      display: block;
      max-width: calc(100vw - 92px);
      overflow: hidden;
      font-size: 1.04rem;
      font-weight: 1000;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .heading {
      display: block;
      margin-top: 2px;
      color: var(--gold);
      font-size: .66rem;
      font-weight: 950;
      letter-spacing: .08em;
    }

    .icon-btn {
      display: grid;
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      font-size: 1.15rem;
      background: var(--panel);
    }

    /*
      IMPORTANT:
      This viewport is the only DOM area controlled by T-Engine.
      Nothing outside this element is transformed by the engine.
    */

    .game-shell {
      position: relative;
      min-height: 0;
      flex: 1;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 25px;
      background: #15182f;
      box-shadow:
        inset 0 0 35px rgba(0,0,0,.32);
      touch-action: none;
      isolation: isolate;
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .control-zone {
      position: absolute;
      z-index: 12;
      right: 11px;
      bottom: 11px;
      width: min(43vw,194px);
      aspect-ratio: 1;
      padding: 7px;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      grid-template-rows: repeat(3,1fr);
      gap: 5px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 29px;
      background: rgba(16,19,45,.84);
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      touch-action: none;
    }

    .direction-button {
      min-width: 0;
      min-height: 0;
      border-radius: 16px;
      color: #f7f9ff;
      font-size: clamp(1rem,5vw,1.45rem);
      font-weight: 1000;
      background: rgba(255,255,255,.12);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.13);
      touch-action: none;
    }

    .direction-button.pressed,
    .direction-button:active {
      color: #12233a;
      background: var(--cyan);
      box-shadow:
        0 0 18px rgba(87,229,255,.74);
    }

    .direction-center {
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: var(--muted);
      font-size: .61rem;
      font-weight: 1000;
      line-height: 1.06;
      text-align: center;
      background: rgba(0,0,0,.24);
      pointer-events: none;
    }

    .action-button {
      position: absolute;
      z-index: 12;
      bottom: 15px;
      left: 14px;
      width: min(34vw,145px);
      min-height: 66px;
      padding: 10px;
      border: 3px solid rgba(255,255,255,.68);
      border-radius: 22px;
      color: #261323;
      font-size: .88rem;
      font-weight: 1000;
      letter-spacing: .05em;
      background: var(--pink);
      box-shadow:
        0 6px 0 rgba(0,0,0,.2),
        0 0 22px rgba(255,110,151,.52);
      touch-action: none;
    }

    .action-button:active,
    .action-button.ready {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,.2);
      filter: brightness(1.06);
    }

    .overlay {
      position: absolute;
      z-index: 30;
      inset: 0;
      display: grid;
      padding: 20px;
      place-items: center;
      text-align: center;
      background: rgba(7,8,24,.8);
      backdrop-filter: blur(5px);
    }

    .overlay-card {
      width: min(370px,100%);
      max-height: 92%;
      overflow: auto;
      padding: 25px 19px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(
          145deg,
          #3d4378,
          #24284d
        );
      box-shadow: var(--shadow);
    }

    .overlay-card h1,
    .overlay-card h2,
    .overlay-card p {
      margin: 0;
    }

    .overlay-card h1 {
      font-size: 1.82rem;
      letter-spacing: -.05em;
    }

    .overlay-card h2 {
      margin-bottom: 8px;
      font-size: 1.48rem;
    }

    .overlay-card p {
      margin: 10px 0 19px;
      color: var(--muted);
      line-height: 1.42;
    }

    .rankings {
      display: grid;
      gap: 8px;
      margin: 15px 0 18px;
      text-align: left;
    }

    .rank {
      display: flex;
      min-height: 50px;
      padding: 10px 13px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-radius: 15px;
      background: rgba(255,255,255,.09);
    }

    .rank:first-child {
      border: 1px solid rgba(255,211,95,.55);
      background: rgba(255,211,95,.19);
    }

    .rank span {
      color: var(--cyan);
      font-size: .84rem;
      font-weight: 900;
      text-align: right;
    }

    #toast {
      position: fixed;
      z-index: 200;
      bottom: calc(var(--safe-bottom) + 12px);
      left: 50%;
      max-width: calc(100% - 36px);
      padding: 11px 15px;
      border-radius: 999px;
      color: #18192d;
      font-size: .84rem;
      font-weight: 950;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      background: #f6f7ff;
      box-shadow: var(--shadow);
      transform: translate(-50%,130px);
      transition:
        opacity .2s ease,
        transform .25s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%,0);
    }

    #rotate {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: none;
      padding: 28px;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #101328;
    }

    #rotate strong {
      display: block;
      margin-bottom: 18px;
      font-size: 4rem;
      transform: rotate(90deg);
    }

    #rotate h2 {
      margin: 0 0 8px;
    }

    #rotate p {
      margin: 0;
      color: var(--muted);
    }

    @media (max-width:360px) {
      .control-zone {
        width: 165px;
      }

      .action-button {
        width: 122px;
      }

      .cartridge {
        min-height: 150px;
        padding: 12px;
      }
    }

    @media (orientation:landscape) and (max-height:650px) {
      #rotate {
        display: flex;
      }
    }

    @media (prefers-reduced-motion:reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <div id="app"></div>
  <div id="toast"></div>

  <div id="rotate">
    <div>
      <strong>▯</strong>
      <h2>Rotate your device</h2>
      <p>T-Engine games are designed for portrait play.</p>
    </div>
  </div>

  <script>
    "use strict";

    /*
    ============================================================
    THUMB ARENA CONSOLE
    ============================================================

    ARCHITECTURE

      CONSOLE
        |
        +-- Cartridge Manager
        |
        +-- Game Session
        |
        +-- Input Router
        |
        +-- T-ENGINE
              |
              +-- World
              +-- Entities
              +-- Physics
              +-- Camera
              +-- Collision
              +-- Tunnel
              +-- Renderer

    IMPORTANT:

      T-Engine does NOT own the application screen.

      It owns only:
        - world state
        - movement
        - physics
        - camera
        - game viewport rendering

      The console owns:
        - menus
        - cartridges
        - profile
        - records
        - game selection
        - overlays

    This makes the T-Engine reusable.
    ============================================================
    */

    const PLAYER_COLORS = [
      "#57e5ff",
      "#ff6e97",
      "#90ff6b",
      "#ffd35f"
    ];

    const SAVE_KEY = "thumbArenaConsoleV2";

    const GAME_CONFIGS = {

      trail2: {
        title: "Trail Duel 2",
        icon: "〰",
        color: "#ad7dff",
        mode: "trail",
        duration: 45000,
        objective: "Survive the energy trails",
        actionLabel: "DASH",
        description:
          "Move in eight directions. Leave an energy trail. Touch a trail or boundary and crash."
      },

      quest: {
        title: "Mini Quest",
        icon: "◇",
        color: "#57e5ff",
        mode: "quest",
        duration: 70000,
        objective: "Collect 5 crystals and reach the portal",
        actionLabel: "ACTION",
        description:
          "Collect crystals, avoid hazards, then reach the portal."
      },

      brawl: {
        title: "Arena Brawl",
        icon: "✦",
        color: "#ff6e97",
        mode: "brawl",
        duration: 60000,
        objective: "Strike targets and avoid danger",
        actionLabel: "ATTACK",
        description:
          "Move with eight directions. Attack enemies when close."
      },

      treasure: {
        title: "Treasure Run",
        icon: "◆",
        color: "#ffd35f",
        mode: "treasure",
        duration: 70000,
        objective: "Collect treasure and return to base",
        actionLabel: "GRAB",
        description:
          "Collect treasure gems, avoid traps, and return to base."
      },

      boss: {
        title: "Boss Break",
        icon: "⚔",
        color: "#90ff6b",
        mode: "boss",
        duration: 90000,
        objective: "Destroy weak points before time expires",
        actionLabel: "ATTACK",
        description:
          "Dodge boss attacks and strike glowing weak points."
      }
    };

    /*
    ============================================================
    STORAGE
    ============================================================
    */

    function loadStorage() {

      const fallback = {

        settings: {
          sound: true,
          vibration: true,
          reducedEffects: false
        },

        arenaProfile: {
          level: 1,
          xp: 0,
          selectedTitle: "Rookie",

          records: {
            trailDuel2: 0,
            miniQuest: 0,
            arenaBrawl: 0,
            treasureRun: 0,
            bossBreak: 0
          }
        }

      };

      try {

        const raw =
          localStorage.getItem(SAVE_KEY);

        if (!raw) {
          return fallback;
        }

        const saved =
          JSON.parse(raw);

        return {

          ...fallback,
          ...saved,

          settings: {
            ...fallback.settings,
            ...(saved.settings || {})
          },

          arenaProfile: {

            ...fallback.arenaProfile,
            ...(saved.arenaProfile || {}),

            records: {
              ...fallback.arenaProfile.records,
              ...(
                saved.arenaProfile?.records ||
                {}
              )
            }

          }

        };

      } catch {

        return fallback;

      }
    }

    function saveStorage(data) {

      try {

        localStorage.setItem(
          SAVE_KEY,
          JSON.stringify(data)
        );

      } catch {}

    }

    /*
    ============================================================
    PLAYERS
    ============================================================
    */

    function safeParsePlayers() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const fallback = [
        {
          id: "local-1",
          name: "Player 1",
          color: PLAYER_COLORS[0]
        }
      ];

      try {

        const encoded =
          params.get("players");

        if (!encoded) {
          return fallback;
        }

        const json =
          decodeURIComponent(
            escape(
              atob(
                decodeURIComponent(encoded)
              )
            )
          );

        const parsed =
          JSON.parse(json);

        if (
          !Array.isArray(parsed) ||
          !parsed.length
        ) {
          return fallback;
        }

        return parsed
          .slice(0,4)
          .map((player,index) => ({

            id:
              typeof player.id === "string"
                ? player.id.slice(0,40)
                : `local-${index + 1}`,

            name:
              typeof player.name === "string"
                ? player.name
                    .replace(/[<>]/g,"")
                    .slice(0,14) ||
                  `Player ${index + 1}`
                : `Player ${index + 1}`,

            color:
              PLAYER_COLORS[index]

          }));

      } catch {

        return fallback;

      }
    }

    /*
    ============================================================
    AUDIO
    ============================================================
    */

    class AudioManager {

      constructor(storage) {

        this.storage = storage;
        this.context = null;

      }

      play(type = "click") {

        if (!this.storage.settings?.sound) {
          return;
        }

        try {

          const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

          if (!AudioContextClass) {
            return;
          }

          if (!this.context) {
            this.context =
              new AudioContextClass();
          }

          if (
            this.context.state ===
            "suspended"
          ) {
            this.context.resume();
          }

          const map = {

            click: [460,.05,"sine"],
            start: [720,.1,"sine"],
            hit: [130,.16,"sawtooth"],
            win: [900,.16,"triangle"],
            point: [760,.06,"square"],
            gold: [1040,.09,"sine"]

          };

          const [
            frequency,
            duration,
            wave
          ] =
            map[type] ||
            map.click;

          const oscillator =
            this.context.createOscillator();

          const gain =
            this.context.createGain();

          oscillator.type = wave;

          oscillator.frequency.setValueAtTime(
            frequency,
            this.context.currentTime
          );

          gain.gain.setValueAtTime(
            .07,
            this.context.currentTime
          );

          gain.gain.exponentialRampToValueAtTime(
            .001,
            this.context.currentTime +
              duration
          );

          oscillator
            .connect(gain)
            .connect(
              this.context.destination
            );

          oscillator.start();

          oscillator.stop(
            this.context.currentTime +
              duration
          );

        } catch {}
      }

      vibrate(pattern = 15) {

        if (
          !this.storage.settings?.vibration
        ) {
          return;
        }

        try {
          navigator.vibrate?.(pattern);
        } catch {}
      }

    }

    /*
    ============================================================
    INPUT ROUTER
    ============================================================

    The input system does not directly manipulate the screen.

    It emits commands.

    T-Engine consumes the commands.

    This is the separation that prevents movement from
    interfering with the console.
    ============================================================
    */

    class InputRouter {

      constructor() {

        this.vector = {
          x: 0,
          y: 0
        };

        this.direction = null;

        this.pad = null;
        this.pressedButton = null;
        this.cleanup = [];

      }

      static map() {

        return {

          nw: {x:-1,y:-1},
          n:  {x:0,y:-1},
          ne: {x:1,y:-1},

          w:  {x:-1,y:0},
          e:  {x:1,y:0},

          sw: {x:-1,y:1},
          s:  {x:0,y:1},
          se: {x:1,y:1}

        };

      }

      mount(container,callback) {

        this.destroy();

        const pad =
          document.createElement("div");

        pad.className =
          "control-zone";

        pad.innerHTML = `

          <button class="direction-button"
            data-dir="nw">↖</button>

          <button class="direction-button"
            data-dir="n">↑</button>

          <button class="direction-button"
            data-dir="ne">↗</button>

          <button class="direction-button"
            data-dir="w">←</button>

          <div class="direction-center">
            8 WAY<br>
            MOVE<br>
            + LOOK
          </div>

          <button class="direction-button"
            data-dir="e">→</button>

          <button class="direction-button"
            data-dir="sw">↙</button>

          <button class="direction-button"
            data-dir="s">↓</button>

          <button class="direction-button"
            data-dir="se">↘</button>

        `;

        container.appendChild(pad);

        this.pad = pad;

        const setDirection =
          direction => {

            const raw =
              InputRouter.map()[direction] ||
              {x:0,y:0};

            const diagonal =
              raw.x !== 0 &&
              raw.y !== 0;

            const multiplier =
              diagonal
                ? Math.SQRT1_2
                : 1;

            this.direction =
              direction || null;

            this.vector = {

              x:
                raw.x *
                multiplier,

              y:
                raw.y *
                multiplier

            };

            if (this.pressedButton) {

              this.pressedButton
                .classList
                .remove("pressed");

            }

            this.pressedButton =
              direction
                ? pad.querySelector(
                    `[data-dir="${direction}"]`
                  )
                : null;

            if (this.pressedButton) {

              this.pressedButton
                .classList
                .add("pressed");

            }

            callback?.(
              this.vector,
              this.direction
            );

          };

        pad
          .querySelectorAll("[data-dir]")
          .forEach(button => {

            const press =
              event => {

                event.preventDefault();

                button.setPointerCapture?.(
                  event.pointerId
                );

                setDirection(
                  button.dataset.dir
                );

              };

            const release =
              event => {

                event?.preventDefault();

                setDirection(null);

              };

            button.addEventListener(
              "pointerdown",
              press,
              {passive:false}
            );

            button.addEventListener(
              "pointerup",
              release,
              {passive:false}
            );

            button.addEventListener(
              "pointercancel",
              release,
              {passive:false}
            );

            button.addEventListener(
              "pointerleave",
              event => {

                if (!event.buttons) {
                  release(event);
                }

              },
              {passive:false}
            );

            this.cleanup.push(() => {

              button.removeEventListener(
                "pointerdown",
                press
              );

              button.removeEventListener(
                "pointerup",
                release
              );

              button.removeEventListener(
                "pointercancel",
                release
              );

            });

          });

        this.cleanup.push(
          () => pad.remove()
        );

      }

      destroy() {

        this.cleanup.forEach(
          fn => fn()
        );

        this.cleanup = [];

        this.pad = null;

        this.pressedButton = null;

        this.direction = null;

        this.vector = {
          x:0,
          y:0
        };

      }

    }

    /*
    ============================================================
    CAMERA
    ============================================================
    */

    class TEngineCamera {

      constructor() {

        this.angle = 0;
        this.targetAngle = 0;
        this.direction = "n";
        this.turnSpeed = 8;

      }

      static angles() {

        return {

          n: 0,
          ne: Math.PI / 4,
          e: Math.PI / 2,
          se: Math.PI * .75,
          s: Math.PI,
          sw: Math.PI * 1.25,
          w: Math.PI * 1.5,
          nw: Math.PI * 1.75

        };

      }

      setDirection(direction) {

        if (
          !(direction in
            TEngineCamera.angles())
        ) {
          return;
        }

        this.direction =
          direction;

        this.targetAngle =
          TEngineCamera.angles()[
            direction
          ];

      }

      update(dt) {

        let difference =
          this.targetAngle -
          this.angle;

        while (
          difference >
          Math.PI
        ) {
          difference -=
            Math.PI * 2;
        }

        while (
          difference <
          -Math.PI
        ) {
          difference +=
            Math.PI * 2;
        }

        this.angle +=
          difference *
          Math.min(
            1,
            this.turnSpeed *
              dt
          );

        this.angle =
          (
            this.angle +
            Math.PI * 2
          ) %
          (Math.PI * 2);

      }

      headingName() {

        const labels = {

          n: "NORTH ↑",
          ne: "NORTHEAST ↗",
          e: "EAST →",
          se: "SOUTHEAST ↘",
          s: "SOUTH ↓",
          sw: "SOUTHWEST ↙",
          w: "WEST ←",
          nw: "NORTHWEST ↖"

        };

        return labels[
          this.direction
        ];

      }

    }

    /*
    ============================================================
    T-ENGINE WORLD
    ============================================================

    This class is the reusable movement/world layer.

    It does NOT:
      - create the application
      - change #app
      - navigate pages
      - manage console UI
      - own overlays
      - own player turns

    It only manages the active world.
    ============================================================
    */

    class TEngineWorld {

      constructor({

        canvas,
        area,
        config,
        gameId,
        player,
        audio

      }) {

        this.canvas = canvas;
        this.area = area;

        this.ctx =
          canvas.getContext("2d");

        this.config = config;
        this.gameId = gameId;
        this.player = player;
        this.audio = audio;

        this.camera =
          new TEngineCamera();

        this.input =
          new InputRouter();

        this.state = null;

        this.running = false;

        this.frame = 0;
        this.lastFrame = 0;

        this.actionButton = null;

        this.onFinish = null;
        this.onToast = null;

        this.resizeHandler =
          () => this.resize();

        window.addEventListener(
          "resize",
          this.resizeHandler
        );

        this.resize();

      }

      /*
      ----------------------------------------------------------
      PUBLIC ENGINE API
      ----------------------------------------------------------
      */

      loadWorld() {

        this.state =
          this.createWorldState();

        this.configureWorld();

      }

      start(onFinish,onToast) {

        this.stop();

        this.onFinish = onFinish;
        this.onToast = onToast;

        this.loadWorld();

        this.mountInput();

        this.running = true;

        this.lastFrame =
          performance.now();

        this.frame =
          requestAnimationFrame(
            now =>
              this.loop(now)
          );

      }

      pause() {

        this.running = false;

        cancelAnimationFrame(
          this.frame
        );

      }

      resume() {

        if (this.running) {
          return;
        }

        if (!this.state) {
          return;
        }

        this.running = true;

        this.lastFrame =
          performance.now();

        this.frame =
          requestAnimationFrame(
            now =>
              this.loop(now)
          );

      }

      stop() {

        this.running = false;

        cancelAnimationFrame(
          this.frame
        );

        this.frame = 0;

        this.input.destroy();

        this.actionButton?.remove();

        this.actionButton = null;

      }

      destroy() {

        this.stop();

        window.removeEventListener(
          "resize",
          this.resizeHandler
        );

        this.state = null;

      }

      /*
      ----------------------------------------------------------
      WORLD STATE
      ----------------------------------------------------------
      */

      createWorldState() {

        return {

          active: true,

          player: this.player,

          startedAt:
            performance.now(),

          timeLeft:
            this.config.duration,

          score: 0,

          health:
            this.gameId === "boss"
              ? 3
              : 1,

          worldSize: 560,

          playerEntity: {

            x: 0,
            y: 0,

            radius: 14,

            speed: 145,

            color:
              this.player.color

          },

          movement: {
            x: 0,
            y: 0
          },

          /*
            Movement energy is bounded.

            Acceleration is limited.
            Maximum speed is fixed.
            No frame can create arbitrary velocity.
          */

          physics: {

            maxSpeed: 145,

            acceleration: 520,

            drag: 7.5,

            velocity: {
              x: 0,
              y: 0
            }

          },

          tunnel: {

            active: true,

            depth: 0,

            speed: .85,

            ringCount: 18,

            branchCount: 8,

            spacing: .82,

            width: 1,

            height: .72

          },

          actionCooldownUntil: 0,
          actionFlashUntil: 0,
          lastHitAt: 0,

          trailTimer: 0,

          portal: null,

          boss: null,

          bossAttackAt: 0,

          bossWeakPoint: null,

          enemies: [],
          hazards: [],
          trails: [],
          crystals: [],
          treasures: [],

          collected: 0

        };

      }

      configureWorld() {

        const state =
          this.state;

        const half =
          state.worldSize / 2;

        if (
          this.gameId ===
          "quest"
        ) {

          for (
            let i = 0;
            i < 5;
            i++
          ) {

            state.crystals.push(
              this.randomWorldPoint(42)
            );

          }

          state.portal = {

            x: half - 62,
            y: half - 62,

            radius: 26,

            active: false

          };

          for (
            let i = 0;
            i < 4;
            i++
          ) {

            state.hazards.push({

              ...this.randomWorldPoint(65),

              radius: 17,

              vx:
                (Math.random()-.5)*38,

              vy:
                (Math.random()-.5)*38

            });

          }

        }

        if (
          this.gameId ===
          "brawl"
        ) {

          for (
            let i = 0;
            i < 6;
            i++
          ) {

            state.enemies.push({

              ...this.randomWorldPoint(55),

              radius: 17,

              health: 2,

              alive: true,

              phase:
                Math.random() *
                Math.PI *
                2

            });

          }

          for (
            let i = 0;
            i < 3;
            i++
          ) {

            state.hazards.push({

              ...this.randomWorldPoint(80),

              radius: 18,

              vx:
                (Math.random()-.5)*46,

              vy:
                (Math.random()-.5)*46

            });

          }

        }

        if (
          this.gameId ===
          "treasure"
        ) {

          for (
            let i = 0;
            i < 8;
            i++
          ) {

            state.treasures.push({

              ...this.randomWorldPoint(45),

              radius: 13,

              value:
                1 +
                Math.floor(
                  Math.random()*3
                )

            });

          }

          state.portal = {

            x: -half + 55,
            y: -half + 55,

            radius: 34,

            active: true,
            base: true

          };

          for (
            let i = 0;
            i < 5;
            i++
          ) {

            state.hazards.push({

              ...this.randomWorldPoint(75),

              radius: 16,

              vx:
                (Math.random()-.5)*50,

              vy:
                (Math.random()-.5)*50

            });

          }

        }

        if (
          this.gameId ===
          "boss"
        ) {

          state.boss = {

            x: 0,
            y: 0,

            radius: 58,

            health: 10,
            maxHealth: 10,

            angle: 0

          };

          state.bossWeakPoint =
            this.makeWeakPoint(
              state.boss
            );

          for (
            let i = 0;
            i < 4;
            i++
          ) {

            state.hazards.push({

              ...this.randomWorldPoint(95),

              radius: 18,

              vx:
                (Math.random()-.5)*44,

              vy:
                (Math.random()-.5)*44

            });

          }

        }

        if (
          this.gameId ===
          "trail2"
        ) {

          state.trails.push({

            color:
              "rgba(173,125,255,.75)",

            points: [

              {x:-210,y:-150},
              {x:-100,y:-150},
              {x:-100,y:-55}

            ]

          });

          state.trails.push({

            color:
              "rgba(255,110,151,.74)",

            points: [

              {x:190,y:150},
              {x:80,y:150},
              {x:80,y:55}

            ]

          });

          for (
            let i = 0;
            i < 4;
            i++
          ) {

            state.hazards.push({

              ...this.randomWorldPoint(80),

              radius: 17,

              vx:
                (Math.random()-.5)*36,

              vy:
                (Math.random()-.5)*36

            });

          }

        }

      }

      randomWorldPoint(
        padding = 40
      ) {

        const size =
          this.state.worldSize;

        const half =
          size / 2 - padding;

        return {

          x:
            -half +
            Math.random() *
            half * 2,

          y:
            -half +
            Math.random() *
            half * 2

        };

      }

      makeWeakPoint(boss) {

        const angle =
          Math.random() *
          Math.PI *
          2;

        const distance =
          boss.radius + 22;

        return {

          x:
            boss.x +
            Math.cos(angle) *
            distance,

          y:
            boss.y +
            Math.sin(angle) *
            distance,

          radius: 15

        };

      }

      /*
      ----------------------------------------------------------
      INPUT -> ENGINE
      ----------------------------------------------------------
      */

      mountInput() {

        this.input.mount(
          this.area,
          (vector,direction) => {

            if (!this.state?.active) {
              return;
            }

            this.state.movement =
              vector;

            if (direction) {

              this.camera
                .setDirection(
                  direction
                );

              const speedMap = {

                n: 1,
                ne: 1.08,
                e: 1.15,
                se: 1.08,
                s: .92,
                sw: 1.08,
                w: 1.15,
                nw: 1.08

              };

              this.state.tunnel.speed =
                speedMap[direction] ||
                1;

            }

          }
        );

        this.actionButton =
          document.createElement(
            "button"
          );

        this.actionButton.className =
          "action-button";

        this.actionButton.textContent =
          this.config.actionLabel;

        this.actionButton.addEventListener(
          "pointerdown",
          event => {

            event.preventDefault();

            this.performAction();

          },
          {passive:false}
        );

        this.area.appendChild(
          this.actionButton
        );

      }

      /*
      ----------------------------------------------------------
      ACTIONS
      ----------------------------------------------------------
      */

      performAction() {

        const state =
          this.state;

        if (
          !state ||
          !state.active
        ) {
          return;
        }

        const now =
          performance.now();

        if (
          now <
          state.actionCooldownUntil
        ) {

          this.toast(
            "Action recharging"
          );

          return;

        }

        state.actionCooldownUntil =
          now + 650;

        state.actionFlashUntil =
          now + 180;

        this.audio.play("point");
        this.audio.vibrate(12);

        if (
          this.gameId ===
          "trail2"
        ) {

          const vector =
            this.input.vector;

          if (
            !vector.x &&
            !vector.y
          ) {

            this.toast(
              "Choose a direction to dash"
            );

            return;

          }

          /*
            Dash transfers bounded movement energy
            rather than teleporting the player.
          */

          state.physics.velocity.x +=
            vector.x * 190;

          state.physics.velocity.y +=
            vector.y * 190;

          this.toast("Dash!");

        }

        if (
          this.gameId ===
          "quest"
        ) {

          const crystal =
            this.nearestEntity(
              state.crystals,
              34
            );

          if (crystal) {

            state.crystals.splice(
              state.crystals.indexOf(
                crystal
              ),
              1
            );

            state.collected++;
            state.score += 3;

            this.audio.play("gold");

            if (
              state.collected >= 5
            ) {

              state.portal.active =
                true;

              this.toast(
                "Portal activated!"
              );

            } else {

              this.toast(
                `Crystal ${state.collected}/5`
              );

            }

          } else {

            this.toast(
              "Move closer to a crystal"
            );

          }

        }

        if (
          this.gameId ===
          "brawl"
        ) {

          const enemy =
            this.nearestEntity(
              state.enemies.filter(
                item => item.alive
              ),
              62
            );

          if (!enemy) {

            this.toast(
              "No enemy in range"
            );

            return;

          }

          enemy.health--;

          state.score += 2;

          const dx =
            enemy.x -
            state.playerEntity.x;

          const dy =
            enemy.y -
            state.playerEntity.y;

          const distance =
            Math.hypot(dx,dy) || 1;

          enemy.x +=
            dx / distance * 28;

          enemy.y +=
            dy / distance * 28;

          if (
            enemy.health <= 0
          ) {

            enemy.alive = false;

            state.score += 4;

            this.audio.play("gold");

            this.toast(
              "Enemy knocked out!"
            );

          } else {

            this.toast("Hit!");

          }

        }

        if (
          this.gameId ===
          "treasure"
        ) {

          const treasure =
            this.nearestEntity(
              state.treasures,
              36
            );

          if (treasure) {

            state.treasures.splice(
              state.treasures.indexOf(
                treasure
              ),
              1
            );

            state.collected +=
              treasure.value;

            state.score +=
              treasure.value;

            this.audio.play("gold");

            this.toast(
              `Treasure +${treasure.value}`
            );

          } else if (
            state.portal &&
            this.distanceTo(
              state.portal
            ) <
            state.portal.radius + 14 &&
            state.collected > 0
          ) {

            state.score +=
              state.collected * 3;

            state.collected = 0;

            this.audio.play("gold");

            this.toast(
              "Treasure banked!"
            );

          } else {

            this.toast(
              "Move close to treasure or base"
            );

          }

        }

        if (
          this.gameId ===
          "boss"
        ) {

          const weak =
            state.bossWeakPoint;

          if (
            weak &&
            this.distanceTo(weak) < 64
          ) {

            state.boss.health--;

            state.score += 3;

            state.bossWeakPoint =
              this.makeWeakPoint(
                state.boss
              );

            this.audio.play("gold");

            this.toast(
              `Weak point hit! Boss HP ${state.boss.health}`
            );

            if (
              state.boss.health <= 0
            ) {

              state.score += 12;

              this.finish(true);

            }

          } else {

            this.toast(
              "Move close to a glowing weak point"
            );

          }

        }

      }

      /*
      ----------------------------------------------------------
      PHYSICS
      ----------------------------------------------------------
      */

      updatePhysics(dt) {

        const state =
          this.state;

        const player =
          state.playerEntity;

        const physics =
          state.physics;

        const input =
          state.movement;

        const targetVX =
          input.x *
          physics.maxSpeed;

        const targetVY =
          input.y *
          physics.maxSpeed;

        const blend =
          Math.min(
            1,
            physics.acceleration *
            dt /
            physics.maxSpeed
          );

        physics.velocity.x +=
          (
            targetVX -
            physics.velocity.x
          ) * blend;

        physics.velocity.y +=
          (
            targetVY -
            physics.velocity.y
          ) * blend;

        if (
          input.x === 0 &&
          input.y === 0
        ) {

          const drag =
            Math.exp(
              -physics.drag *
              dt
            );

          physics.velocity.x *= drag;
          physics.velocity.y *= drag;

        }

        /*
          Hard velocity ceiling.
        */

        const speed =
          Math.hypot(
            physics.velocity.x,
            physics.velocity.y
          );

        if (
          speed >
          physics.maxSpeed
        ) {

          physics.velocity.x =
            physics.velocity.x /
            speed *
            physics.maxSpeed;

          physics.velocity.y =
            physics.velocity.y /
            speed *
            physics.maxSpeed;

        }

        player.x +=
          physics.velocity.x *
          dt;

        player.y +=
          physics.velocity.y *
          dt;

        this.clampPlayer();

      }

      clampPlayer() {

        const state =
          this.state;

        const player =
          state.playerEntity;

        const half =
          state.worldSize / 2 -
          player.radius;

        if (player.x < -half) {

          player.x = -half;

          state.physics.velocity.x =
            Math.abs(
              state.physics.velocity.x
            ) * .35;

        }

        if (player.x > half) {

          player.x = half;

          state.physics.velocity.x =
            -Math.abs(
              state.physics.velocity.x
            ) * .35;

        }

        if (player.y < -half) {

          player.y = -half;

          state.physics.velocity.y =
            Math.abs(
              state.physics.velocity.y
            ) * .35;

        }

        if (player.y > half) {

          player.y = half;

          state.physics.velocity.y =
            -Math.abs(
              state.physics.velocity.y
            ) * .35;

        }

      }

      /*
      ----------------------------------------------------------
      UPDATE
      ----------------------------------------------------------
      */

      update(dt,now) {

        const state =
          this.state;

        const player =
          state.playerEntity;

        if (
          state.tunnel.active
        ) {

          state.tunnel.depth +=
            dt *
            state.tunnel.speed;

          state.tunnel.depth =
            state.tunnel.depth % 1;

        }

        this.updatePhysics(dt);

        this.camera.update(dt);

        state.hazards.forEach(
          hazard => {

            hazard.x +=
              hazard.vx * dt;

            hazard.y +=
              hazard.vy * dt;

            const half =
              state.worldSize / 2 -
              hazard.radius;

            if (
              hazard.x < -half ||
              hazard.x > half
            ) {

              hazard.vx *= -1;

            }

            if (
              hazard.y < -half ||
              hazard.y > half
            ) {

              hazard.vy *= -1;

            }

            if (
              Math.hypot(
                player.x -
                hazard.x,

                player.y -
                hazard.y
              ) <
              player.radius +
              hazard.radius
            ) {

              this.playerHit(hazard);

            }

          }
        );

        if (
          this.gameId ===
          "trail2"
        ) {

          state.trailTimer += dt;

          if (
            state.trailTimer > .08
          ) {

            state.trailTimer = 0;

            let ownTrail =
              state.trails.find(
                item =>
                  item.playerTrail
              );

            if (!ownTrail) {

              ownTrail = {

                playerTrail: true,

                color:
                  player.color,

                points: []

              };

              state.trails.push(
                ownTrail
              );

            }

            ownTrail.points.push({

              x: player.x,
              y: player.y

            });

            if (
              ownTrail.points.length >
              180
            ) {

              ownTrail.points.shift();

            }

          }

          for (
            const trail of state.trails
          ) {

            for (
              let i = 0;
              i < trail.points.length;
              i += 2
            ) {

              const point =
                trail.points[i];

              const own =
                trail.playerTrail;

              if (
                Math.hypot(
                  player.x-point.x,
                  player.y-point.y
                ) <
                player.radius + 7 &&
                (
                  !own ||
                  i <
                  trail.points.length - 10
                )
              ) {

                this.finish(false);

                return;

              }

            }

          }

        }

        if (
          this.gameId ===
          "brawl"
        ) {

          state.enemies
            .filter(
              enemy =>
                enemy.alive
            )
            .forEach(
              enemy => {

                enemy.phase +=
                  dt * 2.2;

                enemy.x +=
                  Math.cos(
                    enemy.phase
                  ) *
                  18 *
                  dt;

                enemy.y +=
                  Math.sin(
                    enemy.phase * 1.3
                  ) *
                  18 *
                  dt;

                if (
                  Math.hypot(
                    player.x-enemy.x,
                    player.y-enemy.y
                  ) <
                  player.radius +
                  enemy.radius
                ) {

                  this.playerHit(
                    enemy
                  );

                }

              }
            );

        }

        if (
          this.gameId ===
          "quest"
        ) {

          if (
            state.portal?.active &&
            this.distanceTo(
              state.portal
            ) <
            state.portal.radius +
            player.radius
          ) {

            this.finish(true);

            return;

          }

        }

        if (
          this.gameId ===
          "treasure"
        ) {

          /*
            Treasure can only be scored by returning
            to the base. Carrying is intentionally separate
            from banked score.
          */

        }

        if (
          this.gameId ===
          "boss"
        ) {

          state.boss.angle +=
            dt * .9;

          if (
            now >
            state.bossAttackAt
          ) {

            state.bossAttackAt =
              now + 2400;

            const dx =
              player.x -
              state.boss.x;

            const dy =
              player.y -
              state.boss.y;

            const distance =
              Math.hypot(dx,dy) || 1;

            state.hazards.push({

              x: state.boss.x,
              y: state.boss.y,

              radius: 14,

              vx:
                dx / distance * 130,

              vy:
                dy / distance * 130,

              bossShot: true

            });

            this.toast(
              "Boss attack!"
            );

          }

        }

      }

      /*
      ----------------------------------------------------------
      COLLISION
      ----------------------------------------------------------
      */

      playerHit(hazard) {

        const state =
          this.state;

        const now =
          performance.now();

        if (
          now -
          state.lastHitAt <
          700
        ) {
          return;
        }

        state.lastHitAt =
          now;

        if (
          this.gameId ===
          "boss"
        ) {

          state.health--;

          this.audio.play("hit");
          this.audio.vibrate(35);

          if (
            state.health <= 0
          ) {

            this.finish(false);

          } else {

            this.toast(
              `Hit! HP ${state.health}`
            );

          }

          return;

        }

        state.score =
          Math.max(
            0,
            state.score - 1
          );

        hazard.vx *= -1;
        hazard.vy *= -1;

        this.audio.play("hit");
        this.audio.vibrate(25);

      }

      nearestEntity(
        items,
        range
      ) {

        const player =
          this.state.playerEntity;

        let best = null;
        let bestDistance =
          Infinity;

        for (
          const item of items
        ) {

          const distance =
            Math.hypot(
              player.x-item.x,
              player.y-item.y
            );

          if (
            distance <= range &&
            distance < bestDistance
          ) {

            best = item;
            bestDistance = distance;

          }

        }

        return best;

      }

      distanceTo(entity) {

        const player =
          this.state.playerEntity;

        return Math.hypot(
          player.x-entity.x,
          player.y-entity.y
        );

      }

      /*
      ----------------------------------------------------------
      LOOP
      ----------------------------------------------------------
      */

      loop(now) {

        if (!this.running) {
          return;
        }

        const state =
          this.state;

        if (
          !state ||
          !state.active
        ) {
          return;
        }

        const dt =
          Math.min(
            (now-this.lastFrame)/1000,
            .05
          );

        this.lastFrame = now;

        state.timeLeft =
          Math.max(
            0,
            this.config.duration -
            (
              now -
              state.startedAt
            )
          );

        this.update(
          dt,
          now
        );

        this.render();

        if (
          state.timeLeft <= 0
        ) {

          this.finish(false);

          return;

        }

        this.frame =
          requestAnimationFrame(
            next =>
              this.loop(next)
          );

      }

      /*
      ==========================================================
      RENDERER
      ==========================================================

      Everything below this line belongs to the T-Engine
      viewport only.
      ==========================================================
      */

      resize() {

        if (!this.area) {
          return;
        }

        const rect =
          this.area.getBoundingClientRect();

        const dpr =
          Math.min(
            window.devicePixelRatio || 1,
            2
          );

        this.canvas.width =
          Math.max(
            1,
            Math.floor(
              rect.width * dpr
            )
          );

        this.canvas.height =
          Math.max(
            1,
            Math.floor(
              rect.height * dpr
            )
          );

        this.ctx.setTransform(
          dpr,
          0,
          0,
          dpr,
          0,
          0
        );

      }

      render() {

        const state =
          this.state;

        const rect =
          this.area.getBoundingClientRect();

        const width =
          rect.width;

        const height =
          rect.height;

        const scale =
          Math.min(
            width,
            height
          ) / 600;

        const ctx =
          this.ctx;

        ctx.clearRect(
          0,
          0,
          width,
          height
        );

        const bg =
          ctx.createLinearGradient(
            0,
            0,
            0,
            height
          );

        bg.addColorStop(
          0,
          "#343d76"
        );

        bg.addColorStop(
          1,
          "#12152c"
        );

        ctx.fillStyle = bg;

        ctx.fillRect(
          0,
          0,
          width,
          height
        );

        ctx.save();

        ctx.translate(
          width/2,
          height/2
        );

        ctx.rotate(
          -this.camera.angle
        );

        ctx.scale(
          scale,
          scale
        );

        ctx.translate(
          -state.playerEntity.x,
          -state.playerEntity.y
        );

        this.drawWorldFloor(
          ctx,
          state
        );

        this.drawTunnelSystem(
          ctx,
          state,
          width/scale,
          height/scale
        );

        this.drawBase(
          ctx,
          state
        );

        this.drawTrails(
          ctx,
          state
        );

        this.drawHazards(
          ctx,
          state
        );

        this.drawGameObjects(
          ctx,
          state
        );

        this.drawPlayer(
          ctx,
          state
        );

        ctx.restore();

        this.drawScreenEffects(
          ctx,
          width,
          height,
          state
        );

      }

      drawWorldFloor(ctx,state) {

        const half =
          state.worldSize/2;

        const size =
          state.worldSize;

        ctx.fillStyle =
          "rgba(19,25,57,.95)";

        ctx.fillRect(
          -half,
          -half,
          size,
          size
        );

        ctx.strokeStyle =
          "rgba(87,229,255,.11)";

        ctx.lineWidth = 1;

        for (
          let x=-half;
          x<=half;
          x+=35
        ) {

          ctx.beginPath();

          ctx.moveTo(
            x,
            -half
          );

          ctx.lineTo(
            x,
            half
          );

          ctx.stroke();

        }

        for (
          let y=-half;
          y<=half;
          y+=35
        ) {

          ctx.beginPath();

          ctx.moveTo(
            -half,
            y
          );

          ctx.lineTo(
            half,
            y
          );

          ctx.stroke();

        }

        ctx.strokeStyle =
          "rgba(255,255,255,.42)";

        ctx.lineWidth = 6;

        ctx.strokeRect(
          -half,
          -half,
          size,
          size
        );

      }

      drawTunnelSystem(
        ctx,
        state,
        width,
        height
      ) {

        if (
          !state.tunnel.active
        ) {
          return;
        }

        const tunnel =
          state.tunnel;

        const horizon =
          height*.43;

        const maxDepth =
          Math.max(
            width,
            height
          )*1.65;

        const nearWidth =
          width*.82*
          tunnel.width;

        const nearHeight =
          height*.72*
          tunnel.height;

        const farWidth =
          width*.045;

        const farHeight =
          height*.035;

        const centerX = 0;

        const centerY =
          horizon;

        const glow =
          ctx.createRadialGradient(
            centerX,
            centerY,
            4,
            centerX,
            centerY,
            maxDepth
          );

        glow.addColorStop(
          0,
          "rgba(87,229,255,.16)"
        );

        glow.addColorStop(
          .35,
          "rgba(173,125,255,.08)"
        );

        glow.addColorStop(
          1,
          "rgba(0,0,0,0)"
        );

        ctx.fillStyle = glow;

        ctx.fillRect(
          -width/2,
          -height/2,
          width,
          height
        );

        const perspective =
          z => {

            const p =
              Math.pow(
                Math.max(
                  .001,
                  1-z
                ),
                1.72
              );

            return {

              width:
                farWidth +
                (
                  nearWidth -
                  farWidth
                )*p,

              height:
                farHeight +
                (
                  nearHeight -
                  farHeight
                )*p,

              x:centerX,

              y:
                centerY -
                height*.035*p

            };

          };

        for (
          let i=tunnel.ringCount;
          i>=0;
          i--
        ) {

          const z =
            (
              i/
              tunnel.ringCount +
              tunnel.depth
            )%1;

          const p =
            perspective(z);

          const alpha =
            .08 +
            Math.pow(
              1-z,
              1.5
            )*.30;

          ctx.beginPath();

          ctx.rect(
            p.x-p.width/2,
            p.y-p.height/2,
            p.width,
            p.height
          );

          ctx.strokeStyle =
            `rgba(87,229,255,${alpha})`;

          ctx.lineWidth =
            Math.max(
              .7,
              2.2*(1-z)
            );

          ctx.stroke();

        }

        const rails = [

          [-.5,-.5],
          [0,-.5],
          [.5,-.5],

          [-.5,0],
          [.5,0],

          [-.5,.5],
          [0,.5],
          [.5,.5]

        ];

        rails.forEach(
          ([rx,ry]) => {

            const near =
              perspective(0);

            const far =
              perspective(.98);

            ctx.beginPath();

            ctx.moveTo(
              near.x+
              near.width*rx,
              near.y+
              near.height*ry
            );

            ctx.lineTo(
              far.x+
              far.width*rx,
              far.y+
              far.height*ry
            );

            ctx.strokeStyle =
              "rgba(173,125,255,.18)";

            ctx.lineWidth = 1;

            ctx.stroke();

          }
        );

        /*
          Depth measurement grid.
        */

        for (
          let i=0;
          i<9;
          i++
        ) {

          const z=i/9;

          const p=
            perspective(z);

          ctx.beginPath();

          ctx.moveTo(
            p.x-p.width/2,
            p.y
          );

          ctx.lineTo(
            p.x+p.width/2,
            p.y
          );

          ctx.moveTo(
            p.x,
            p.y-p.height/2
          );

          ctx.lineTo(
            p.x,
            p.y+p.height/2
          );

          ctx.strokeStyle =
            `rgba(255,255,255,${.035+(1-z)*.06})`;

          ctx.lineWidth=1;

          ctx.stroke();

        }

        /*
          Floor and ceiling depth lines.
        */

        for (
          let i=0;
          i<13;
          i++
        ) {

          const z =
            (
              i/13+
              tunnel.depth*.72
            )%1;

          const p =
            perspective(z);

          ctx.beginPath();

          ctx.moveTo(
            p.x-p.width/2,
            p.y+p.height/2
          );

          ctx.lineTo(
            p.x+p.width/2,
            p.y+p.height/2
          );

          ctx.strokeStyle =
            `rgba(87,229,255,${.04+(1-z)*.10})`;

          ctx.stroke();

          ctx.beginPath();

          ctx.moveTo(
            p.x-p.width/2,
            p.y-p.height/2
          );

          ctx.lineTo(
            p.x+p.width/2,
            p.y-p.height/2
          );

          ctx.strokeStyle =
            `rgba(173,125,255,${.035+(1-z)*.08})`;

          ctx.stroke();

        }

        /*
          Eight directional branch mouths.
        */

        const branches = [

          [0,-1,"N"],
          [.707,-.707,"NE"],
          [1,0,"E"],
          [.707,.707,"SE"],
          [0,1,"S"],
          [-.707,.707,"SW"],
          [-1,0,"W"],
          [-.707,-.707,"NW"]

        ];

        const branchDistance =
          Math.min(
            width,
            height
          )*.39;

        branches.forEach(
          ([bxDir,byDir,label],index) => {

            const pulse =
              .65+
              Math.sin(
                performance.now()/900+
                index
              )*.15;

            const bx =
              bxDir*
              branchDistance;

            const by =
              horizon+
              byDir*
              branchDistance*
              .55;

            const visibility =
              byDir<0
                ? .42
                : .20;

            ctx.save();

            ctx.translate(
              bx,
              by
            );

            ctx.rotate(
              Math.atan2(
                byDir,
                bxDir
              )+
              Math.PI/2
            );

            const branchWidth =
              Math.min(
                width,
                height
              )*.12*pulse;

            const branchHeight =
              Math.min(
                width,
                height
              )*.07*pulse;

            ctx.beginPath();

            ctx.ellipse(
              0,
              0,
              branchWidth,
              branchHeight,
              0,
              0,
              Math.PI*2
            );

            ctx.strokeStyle =
              `rgba(87,229,255,${visibility})`;

            ctx.lineWidth=2;

            ctx.shadowColor =
              "#57e5ff";

            ctx.shadowBlur=14;

            ctx.stroke();

            ctx.beginPath();

            ctx.ellipse(
              0,
              0,
              branchWidth*.58,
              branchHeight*.58,
              0,
              0,
              Math.PI*2
            );

            ctx.fillStyle =
              "rgba(20,24,52,.72)";

            ctx.fill();

            ctx.strokeStyle =
              `rgba(173,125,255,${visibility*.75})`;

            ctx.lineWidth=1.5;

            ctx.stroke();

            ctx.shadowBlur=0;

            ctx.restore();

          }
        );

        ctx.beginPath();

        ctx.arc(
          centerX,
          centerY,
          4+
          Math.sin(
            performance.now()/300
          )*1.5,
          0,
          Math.PI*2
        );

        ctx.fillStyle =
          "#57e5ff";

        ctx.shadowColor =
          "#57e5ff";

        ctx.shadowBlur=18;

        ctx.fill();

        ctx.shadowBlur=0;

      }

      drawBase(ctx,state) {

        if (
          !state.portal?.base
        ) {
          return;
        }

        ctx.save();

        ctx.translate(
          state.portal.x,
          state.portal.y
        );

        ctx.beginPath();

        ctx.arc(
          0,
          0,
          state.portal.radius,
          0,
          Math.PI*2
        );

        ctx.fillStyle =
          "rgba(87,229,255,.22)";

        ctx.shadowColor =
          "#57e5ff";

        ctx.shadowBlur=24;

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
          0,
          0,
          state.portal.radius*.65,
          0,
          Math.PI*2
        );

        ctx.fillStyle =
          "#57e5ff";

        ctx.fill();

        ctx.restore();

      }

      drawTrails(ctx,state) {

        state.trails.forEach(
          trail => {

            if (
              !trail.points ||
              trail.points.length<2
            ) {
              return;
            }

            ctx.beginPath();

            ctx.moveTo(
              trail.points[0].x,
              trail.points[0].y
            );

            for (
              let i=1;
              i<trail.points.length;
              i++
            ) {

              ctx.lineTo(
                trail.points[i].x,
                trail.points[i].y
              );

            }

            ctx.strokeStyle =
              trail.color;

            ctx.lineWidth =
              trail.playerTrail
                ? 9
                : 11;

            ctx.lineCap =
              "round";

            ctx.lineJoin =
              "round";

            ctx.shadowColor =
              trail.color;

            ctx.shadowBlur=9;

            ctx.stroke();

            ctx.shadowBlur=0;

          }
        );

      }

      drawHazards(ctx,state) {

        state.hazards.forEach(
          hazard => {

            ctx.beginPath();

            ctx.arc(
              hazard.x,
              hazard.y,
              hazard.radius,
              0,
              Math.PI*2
            );

            ctx.fillStyle =
              hazard.bossShot
                ? "#ffd35f"
                : "#ff6e97";

            ctx.shadowColor =
              ctx.fillStyle;

            ctx.shadowBlur=15;

            ctx.fill();

            ctx.shadowBlur=0;

            ctx.lineWidth=2;

            ctx.strokeStyle="#fff";

            ctx.stroke();

          }
        );

      }

      drawGameObjects(ctx,state) {

        if (
          this.gameId ===
          "quest"
        ) {

          state.crystals.forEach(
            crystal => {

              this.drawDiamond(
                ctx,
                crystal.x,
                crystal.y,
                14,
                "#57e5ff"
              );

            }
          );

          if (
            state.portal?.active
          ) {

            ctx.save();

            ctx.translate(
              state.portal.x,
              state.portal.y
            );

            ctx.rotate(
              performance.now()/700
            );

            ctx.beginPath();

            ctx.arc(
              0,
              0,
              state.portal.radius,
              0,
              Math.PI*2
            );

            ctx.fillStyle =
              "rgba(173,125,255,.24)";

            ctx.shadowColor =
              "#ad7dff";

            ctx.shadowBlur=24;

            ctx.fill();

            ctx.beginPath();

            ctx.arc(
              0,
              0,
              state.portal.radius*.62,
              0,
              Math.PI*2
            );

            ctx.fillStyle =
              "#ad7dff";

            ctx.fill();

            ctx.restore();

          }

        }

        if (
          this.gameId ===
          "treasure"
        ) {

          state.treasures.forEach(
            treasure => {

              this.drawDiamond(
                ctx,
                treasure.x,
                treasure.y,
                13+
                treasure.value*2,
                "#ffd35f"
              );

            }
          );

        }

        if (
          this.gameId ===
          "brawl"
        ) {

          state.enemies
            .filter(
              enemy =>
                enemy.alive
            )
            .forEach(
              enemy => {

                ctx.beginPath();

                ctx.arc(
                  enemy.x,
                  enemy.y,
                  enemy.radius,
                  0,
                  Math.PI*2
                );

                ctx.fillStyle =
                  "#ff6e97";

                ctx.shadowColor =
                  "#ff6e97";

                ctx.shadowBlur=14;

                ctx.fill();

                ctx.shadowBlur=0;

                ctx.lineWidth=3;

                ctx.strokeStyle="#fff";

                ctx.stroke();

                ctx.fillStyle =
                  "#1b1d36";

                ctx.font =
                  "bold 12px system-ui";

                ctx.textAlign =
                  "center";

                ctx.fillText(
                  String(enemy.health),
                  enemy.x,
                  enemy.y+4
                );

              }
            );

        }

        if (
          this.gameId ===
          "boss"
        ) {

          const boss =
            state.boss;

          ctx.save();

          ctx.translate(
            boss.x,
            boss.y
          );

          ctx.rotate(
            boss.angle
          );

          ctx.beginPath();

          ctx.arc(
            0,
            0,
            boss.radius,
            0,
            Math.PI*2
          );

          ctx.fillStyle =
            "#602d65";

          ctx.shadowColor =
            "#ff6e97";

          ctx.shadowBlur=26;

          ctx.fill();

          ctx.shadowBlur=0;

          ctx.lineWidth=5;

          ctx.strokeStyle =
            "#ffb0c5";

          ctx.stroke();

          for (
            let i=0;
            i<6;
            i++
          ) {

            const angle =
              i*Math.PI/3;

            ctx.beginPath();

            ctx.arc(
              Math.cos(angle)*
              boss.radius*.56,

              Math.sin(angle)*
              boss.radius*.56,

              7,
              0,
              Math.PI*2
            );

            ctx.fillStyle =
              "#ffd35f";

            ctx.fill();

          }

          ctx.restore();

          const weak =
            state.bossWeakPoint;

          if (weak) {

            this.drawDiamond(
              ctx,
              weak.x,
              weak.y,
              weak.radius,
              "#90ff6b"
            );

          }

        }

      }

      drawDiamond(
        ctx,
        x,
        y,
        radius,
        color
      ) {

        ctx.save();

        ctx.translate(
          x,
          y
        );

        ctx.rotate(
          performance.now()/650
        );

        ctx.beginPath();

        ctx.moveTo(
          0,
          -radius
        );

        ctx.lineTo(
          radius,
          0
        );

        ctx.lineTo(
          0,
          radius
        );

        ctx.lineTo(
          -radius,
          0
        );

        ctx.closePath();

        ctx.fillStyle =
          color;

        ctx.shadowColor =
          color;

        ctx.shadowBlur=18;

        ctx.fill();

        ctx.shadowBlur=0;

        ctx.lineWidth=2;

        ctx.strokeStyle="#fff";

        ctx.stroke();

        ctx.restore();

      }

      drawPlayer(ctx,state) {

        const player =
          state.playerEntity;

        ctx.save();

        ctx.translate(
          player.x,
          player.y
        );

        ctx.beginPath();

        ctx.arc(
          0,
          0,
          player.radius,
          0,
          Math.PI*2
        );

        ctx.fillStyle =
          player.color;

        ctx.shadowColor =
          player.color;

        ctx.shadowBlur=20;

        ctx.fill();

        ctx.shadowBlur=0;

        ctx.lineWidth=4;

        ctx.strokeStyle =
          "#f7fbff";

        ctx.stroke();

        const lookX =
          Math.sin(
            this.camera.angle
          )*9;

        const lookY =
          -Math.cos(
            this.camera.angle
          )*9;

        ctx.beginPath();

        ctx.arc(
          lookX,
          lookY,
          5,
          0,
          Math.PI*2
        );

        ctx.fillStyle =
          "#18203b";

        ctx.fill();

        if (
          performance.now() <
          state.actionFlashUntil
        ) {

          ctx.beginPath();

          ctx.arc(
            0,
            0,
            player.radius+17,
            0,
            Math.PI*2
          );

          ctx.strokeStyle="#fff";

          ctx.lineWidth=4;

          ctx.stroke();

        }

        ctx.restore();

      }

      drawScreenEffects(
        ctx,
        width,
        height,
        state
      ) {

        if (
          this.gameId ===
          "boss"
        ) {

          const ratio =
            state.boss.health /
            state.boss.maxHealth;

          ctx.fillStyle =
            "rgba(0,0,0,.32)";

          ctx.fillRect(
            16,
            16,
            width-32,
            12
          );

          ctx.fillStyle =
            ratio>.45
              ? "#90ff6b"
              : "#ff6e97";

          ctx.fillRect(
            16,
            16,
            (width-32)*ratio,
            12
          );

          ctx.strokeStyle =
            "rgba(255,255,255,.6)";

          ctx.strokeRect(
            16,
            16,
            width-32,
            12
          );

        }

      }

      /*
      ----------------------------------------------------------
      ENGINE FINISH
      ----------------------------------------------------------
      */

      finish(victory) {

        const state =
          this.state;

        if (
          !state ||
          !state.active
        ) {
          return;
        }

        state.active = false;

        this.stop();

        const elapsed =
          Math.round(
            (
              this.config.duration -
              state.timeLeft
            )/1000
          );

        let score =
          state.score;

        if (
          this.gameId ===
          "trail2"
        ) {

          score =
            victory
              ? 100
              : Math.max(
                  0,
                  elapsed*2+
                  state.score
                );

        }

        if (
          this.gameId ===
          "quest" &&
          state.collected>=5
        ) {

          score += 10;

        }

        if (
          this.gameId ===
          "boss" &&
          victory
        ) {

          score += 20;

        }

        this.onFinish?.({

          player: this.player,
          score,
          victory,
          elapsed

        });

      }

      toast(message) {

        this.onToast?.(
          message
        );

      }

    }

    /*
    ============================================================
    THUMB ARENA CONSOLE
    ============================================================
    */

    class ThumbArenaConsole {

      constructor() {

        this.storage =
          loadStorage();

        this.audio =
