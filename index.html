          new AudioManager(
            this.storage
          );

        this.players =
          safeParsePlayers();

        this.currentGameId =
          this.getRequestedGame();

        this.currentConfig =
          GAME_CONFIGS[
            this.currentGameId
          ];

        this.currentPlayerIndex = 0;

        this.turnResults = [];

        this.engine = null;

        this.app =
          document.querySelector(
            "#app"
          );

        this.toastTimer = null;

        document.addEventListener(
          "contextmenu",
          event =>
            event.preventDefault()
        );

        this.renderConsole();

        /*
          If ?game=quest was supplied,
          launch that cartridge.
          Otherwise show the console.
        */

        const params =
          new URLSearchParams(
            window.location.search
          );

        if (params.get("game")) {

          setTimeout(
            () =>
              this.openGame(
                this.currentGameId
              ),
            0
          );

        }

      }

      getRequestedGame() {

        const params =
          new URLSearchParams(
            window.location.search
          );

        const id =
          params.get("game");

        return GAME_CONFIGS[id]
          ? id
          : "quest";

      }

      /*
      ----------------------------------------------------------
      CONSOLE
      ----------------------------------------------------------
      */

      renderConsole() {

        this.app.innerHTML = `

          <main class="screen active">

            <header class="console-header">

              <div class="brand">

                <small>
                  T-ENGINE CONSOLE
                </small>

                <strong>
                  THUMB ARENA
                </strong>

              </div>

              <div class="profile-chip">

                <b id="consoleLevel">
                  LV ${this.storage.arenaProfile.level}
                </b>

                ${this.escape(
                  this.storage.arenaProfile.selectedTitle
                )}

              </div>

            </header>

            <div class="console-body">

              <div class="section-label">
                Cartridges
              </div>

              <section
                id="cartridgeGrid"
                class="cartridge-grid"
              ></section>

              <section class="console-panel">

                <div class="console-panel-title">
                  LOCAL PROFILE
                </div>

                <div class="console-stats">

                  <div class="stat">

                    <b id="profileXP">
                      ${this.storage.arenaProfile.xp}
                    </b>

                    <span>XP</span>

                  </div>

                  <div class="stat">

                    <b>
                      ${this.players.length}
                    </b>

                    <span>PLAYERS</span>

                  </div>

                  <div class="stat">

                    <b>
                      ${Object.values(
                        this.storage
                          .arenaProfile
                          .records
                      ).reduce(
                        (sum,value) =>
                          sum +
                          Number(value||0),
                        0
                      )}
                    </b>

                    <span>RECORD PTS</span>

                  </div>

                </div>

                <div class="console-actions">

                  <button
                    id="resetButton"
                    class="btn dark"
                  >
                    RESET LOCAL PROFILE
                  </button>

                </div>

              </section>

            </div>

          </main>

        `;

        this.renderCartridges();

        document
          .querySelector(
            "#resetButton"
          )
          .onclick = () => {

            if (
              confirm(
                "Reset local Thumb Arena progression?"
              )
            ) {

              localStorage.removeItem(
                SAVE_KEY
              );

              this.storage =
                loadStorage();

              this.renderConsole();

            }

          };

      }

      renderCartridges() {

        const grid =
          document.querySelector(
            "#cartridgeGrid"
          );

        const recordMap = {

          trail2:
            "trailDuel2",

          quest:
            "miniQuest",

          brawl:
            "arenaBrawl",

          treasure:
            "treasureRun",

          boss:
            "bossBreak"

        };

        grid.innerHTML =
          Object.entries(
            GAME_CONFIGS
          )
          .map(
            ([id,config]) => {

              const record =
                this.storage
                  .arenaProfile
                  .records[
                    recordMap[id]
                  ] || 0;

              return `

                <button
                  class="cartridge"
                  data-game="${id}"
                  style="border-color:${config.color}55"
                >

                  <span
                    class="cartridge-icon"
                    style="color:${config.color}"
                  >
                    ${config.icon}
                  </span>

                  <span class="cartridge-title">
                    ${this.escape(
                      config.title
                    )}
                  </span>

                  <span class="cartridge-description">
                    ${this.escape(
                      config.description
                    )}
                  </span>

                  <span class="cartridge-record">
                    RECORD ${record}
                  </span>

                </button>

              `;

            }
          )
          .join("");

        grid
          .querySelectorAll(
            "[data-game]"
          )
          .forEach(button => {

            button.onclick = () => {

              this.audio.play(
                "click"
              );

              this.openGame(
                button.dataset.game
              );

            };

          });

      }

      /*
      ----------------------------------------------------------
      GAME SHELL
      ----------------------------------------------------------
      */

      openGame(gameId) {

        if (
          !GAME_CONFIGS[gameId]
        ) {
          return;
        }

        this.currentGameId =
          gameId;

        this.currentConfig =
          GAME_CONFIGS[gameId];

        this.currentPlayerIndex = 0;

        this.turnResults = [];

        this.app.innerHTML = `

          <main class="screen active game-screen">

            <div class="hud">

              <div class="hud-left">

                <span class="hud-label">
                  ${this.escape(
                    this.currentConfig.title
                  )}
                </span>

                <span
                  id="hudValue"
                  class="hud-value"
                >
                  Preparing T-Engine…
                </span>

                <span
                  id="headingValue"
                  class="heading"
                >
                  LOOK: NORTH ↑ • ENGINE READY
                </span>

              </div>

              <button
                id="exitButton"
                class="icon-btn"
                aria-label="Exit game"
              >
                ✕
              </button>

            </div>

            <section
              id="gameArea"
              class="game-shell"
            >

              <canvas
                id="gameCanvas"
              ></canvas>

            </section>

          </main>

        `;

        document
          .querySelector(
            "#exitButton"
          )
          .onclick = () => {

            this.stopEngine();

            this.showConsole();

          };

        this.showIntro();

      }

      showIntro() {

        const area =
          document.querySelector(
            "#gameArea"
          );

        if (!area) {
          return;
        }

        const overlay =
          document.createElement(
            "div"
          );

        overlay.className =
          "overlay";

        overlay.innerHTML = `

          <div class="overlay-card">

            <div
              style="
                font-size:3.1rem;
                margin-bottom:3px
              "
            >
              ${this.currentConfig.icon}
            </div>

            <h1>
              ${this.escape(
                this.currentConfig.title
              )}
            </h1>

            <p>
              ${this.escape(
                this.currentConfig.description
              )}
            </p>

            <p style="font-size:.8rem">

              T-Engine provides the
              movement, physics, camera,
              multidirectional tunnel,
              depth grid, collision,
              and world system.

              The console remains
              outside the engine.

            </p>

            <button
              id="startButton"
              class="btn"
            >
              START
            </button>

            <div style="height:10px"></div>

            <button
              id="backButton"
              class="btn dark"
            >
              RETURN TO CONSOLE
            </button>

          </div>

        `;

        area.appendChild(
          overlay
        );

        overlay
          .querySelector(
            "#startButton"
          )
          .onclick = () => {

            overlay.remove();

            this.audio.play(
              "start"
            );

            this.startNextPlayer();

          };

        overlay
          .querySelector(
            "#backButton"
          )
          .onclick = () => {

            this.showConsole();

          };

      }

      /*
      ----------------------------------------------------------
      PASS & PLAY
      ----------------------------------------------------------
      */

      startNextPlayer() {

        if (
          this.currentPlayerIndex >=
          this.players.length
        ) {

          this.finishGame();

          return;

        }

        const player =
          this.players[
            this.currentPlayerIndex
          ];

        this.showPassOverlay(
          player,
          () =>
            this.beginTurn(player)
        );

      }

      showPassOverlay(
        player,
        onReady
      ) {

        const area =
          document.querySelector(
            "#gameArea"
          );

        const overlay =
          document.createElement(
            "div"
          );

        overlay.className =
          "overlay";

        overlay.innerHTML = `

          <div class="overlay-card">

            <div class="hud-label">
              T-ENGINE PASS & PLAY
            </div>

            <h2
              style="color:${player.color}"
            >
              PASS TO
              ${this.escape(
                player.name.toUpperCase()
              )}
            </h2>

            <p>

              The T-Engine world will
              remain isolated to the
              game viewport.

              Move with eight directions
              and control the virtual
              camera.

            </p>

            <button
              id="readyButton"
              class="btn"
            >
              TAP WHEN READY
            </button>

          </div>

        `;

        area.appendChild(
          overlay
        );

        overlay
          .querySelector(
            "#readyButton"
          )
          .onclick = () => {

            overlay.remove();

            onReady();

          };

      }

      /*
      ----------------------------------------------------------
      ENGINE SESSION
      ----------------------------------------------------------
      */

      beginTurn(player) {

        this.stopEngine();

        const area =
          document.querySelector(
            "#gameArea"
          );

        const canvas =
          document.querySelector(
            "#gameCanvas"
          );

        this.engine =
          new TEngineWorld({

            canvas,
            area,

            config:
              this.currentConfig,

            gameId:
              this.currentGameId,

            player,

            audio:
              this.audio

          });

        this.engine.start(

          result =>
            this.onTurnFinished(
              result
            ),

          message =>
            this.showToast(
              message
            )

        );

        this.updateHUD();

        this.hudTimer =
          setInterval(
            () =>
              this.updateHUD(),
            200
          );

      }

      stopEngine() {

        clearInterval(
          this.hudTimer
        );

        this.hudTimer = null;

        if (this.engine) {

          this.engine.destroy();

          this.engine = null;

        }

      }

      onTurnFinished(result) {

        this.stopEngine();

        const player =
          result.player;

        this.turnResults.push({

          playerId:
            player.id,

          name:
            player.name,

          color:
            player.color,

          score:
            result.score,

          detail:
            `${result.score} points`

        });

        this.updateLocalRecords(
          result.score
        );

        this.currentPlayerIndex++;

        setTimeout(
          () =>
            this.startNextPlayer(),
          650
        );

      }

      /*
      ----------------------------------------------------------
      HUD
      ----------------------------------------------------------
      */

      updateHUD() {

        if (!this.engine) {
          return;
        }

        const state =
          this.engine.state;

        if (!state) {
          return;
        }

        const seconds =
          Math.ceil(
            state.timeLeft/1000
          );

        let text =
          `${seconds}s • ${state.score} pts`;

        if (
          this.currentGameId ===
          "quest"
        ) {

          text =
            `${seconds}s • Crystals ${state.collected}/5 • ${state.score} pts`;

        }

        if (
          this.currentGameId ===
          "treasure"
        ) {

          text =
            `${seconds}s • Carrying ${state.collected} • ${state.score} pts`;

        }

        if (
          this.currentGameId ===
          "boss"
        ) {

          text =
            `${seconds}s • HP ${"♥".repeat(state.health)} • Boss ${state.boss.health}/${state.boss.maxHealth}`;

        }

        if (
          this.currentGameId ===
          "trail2"
        ) {

          text =
            `${seconds}s • Trail survival • ${state.score} pts`;

        }

        const hud =
          document.querySelector(
            "#hudValue"
          );

        const heading =
          document.querySelector(
            "#headingValue"
          );

        if (hud) {

          hud.textContent =
            `${state.player.name} • ${text}`;

        }

        if (heading) {

          heading.textContent =
            `LOOK: ${this.engine.camera.headingName()} • TUNNEL 3D • ENGINE ACTIVE`;

        }

      }

      /*
      ----------------------------------------------------------
      PROFILE
      ----------------------------------------------------------
      */

      updateLocalRecords(score) {

        const records =
          this.storage
            .arenaProfile
            .records;

        const recordMap = {

          trail2:
            "trailDuel2",

          quest:
            "miniQuest",

          brawl:
            "arenaBrawl",

          treasure:
            "treasureRun",

          boss:
            "bossBreak"

        };

        const key =
          recordMap[
            this.currentGameId
          ];

        if (key) {

          records[key] =
            Math.max(
              Number(records[key] || 0),
              score
            );

        }

        this.storage
          .arenaProfile
          .xp +=
          Math.max(
            8,
            Math.round(
              score*1.5
            )
          );

        this.storage
          .arenaProfile
          .level =
          Math.max(
            1,
            Math.floor(
              this.storage
                .arenaProfile
                .xp/100
            )+1
          );

        if (
          this.storage
            .arenaProfile
            .level >= 5
        ) {

          this.storage
            .arenaProfile
            .selectedTitle =
            "Storm Master";

        }

        saveStorage(
          this.storage
        );

      }

      /*
      ----------------------------------------------------------
      RESULTS
      ----------------------------------------------------------
      */

      finishGame() {

        this.stopEngine();

        const results =
          [...this.turnResults]
          .sort(
            (a,b) =>
              b.score-a.score
          )
          .map(
            (result,index) => ({

              ...result,

              detail:
                index === 0
                  ? `${result.score} points • Winner`
                  : `${result.score} points`

            })
          );

        const area =
          document.querySelector(
            "#gameArea"
          );

        const overlay =
          document.createElement(
            "div"
          );

        overlay.className =
          "overlay";

        overlay.innerHTML = `

          <div class="overlay-card">

            <div style="font-size:3.4rem">
              🏆
            </div>

            <h1>
              ${this.escape(
                this.currentConfig.title
                  .toUpperCase()
              )}
            </h1>

            <p>
              ${this.escape(
                results[0]?.name ||
                "Player"
              )}
              wins this round.
            </p>

            <div class="rankings">

              ${
                results
                  .map(
                    (result,index) => `

                      <div class="rank">

                        <strong>
                          ${index+1}.
                          ${this.escape(
                            result.name
                          )}
                        </strong>

                        <span>
                          ${this.escape(
                            result.detail
                          )}
                        </span>

                      </div>

                    `
                  )
                  .join("")
              }

            </div>

            <button
              id="replayButton"
              class="btn"
            >
              PLAY AGAIN
            </button>

            <div style="height:10px"></div>

            <button
              id="consoleButton"
              class="btn secondary"
            >
              RETURN TO CONSOLE
            </button>

          </div>

        `;

        area.appendChild(
          overlay
        );

        overlay
          .querySelector(
            "#replayButton"
          )
          .onclick = () => {

            overlay.remove();

            this.currentPlayerIndex = 0;

            this.turnResults = [];

            this.showIntro();

          };

        overlay
          .querySelector(
            "#consoleButton"
          )
          .onclick = () => {

            this.showConsole();

          };

      }

      /*
      ----------------------------------------------------------
      CONSOLE RETURN
      ----------------------------------------------------------
      */

      showConsole() {

        this.stopEngine();

        this.currentPlayerIndex = 0;

        this.turnResults = [];

        this.renderConsole();

        history.replaceState(
          null,
          "",
          "index.html"
        );

      }

      /*
      ----------------------------------------------------------
      TOAST
      ----------------------------------------------------------
      */

      showToast(message) {

        const toast =
          document.querySelector(
            "#toast"
          );

        if (!toast) {
          return;
        }

        toast.textContent =
          message;

        toast.classList.add(
          "show"
        );

        clearTimeout(
          this.toastTimer
        );

        this.toastTimer =
          setTimeout(
            () => {

              toast.classList.remove(
                "show"
              );

            },
            1500
          );

      }

      escape(value) {

        return String(value)

          .replace(
            /&/g,
            "&amp;"
          )

          .replace(
            /</g,
            "&lt;"
          )

          .replace(
            />/g,
            "&gt;"
          )

          .replace(
            /"/g,
            "&quot;"
          )

          .replace(
            /'/g,
            "&#039;"
          );

      }

    }

    /*
    ============================================================
    BOOT
    ============================================================

    Only the console is created here.

    The T-Engine is instantiated only when a cartridge is
    actually running.

    Therefore:

      Console exists without T-Engine.
      Cartridge exists without T-Engine.
      T-Engine exists only for the active world.

    This is the separation that prevents the movement loop
    from becoming the application loop.
    ============================================================
    */

    new ThumbArenaConsole();

  </script>
